name: Publish packages

# Manual release trigger. Bump versions in each package's package.json before
# running.
#
# Auth: npm trusted publishing (OIDC). The publish steps below do NOT set
# `NODE_AUTH_TOKEN` — npm 11.5+ on Node 24 exchanges a GitHub Actions OIDC
# ID token for a short-lived npm publish token via the trusted-publisher
# config registered at
#   https://www.npmjs.com/package/<name>/access
# No NPM_TOKEN secret is required.
#
# Requirements:
#  - `permissions: id-token: write` on the job (set below)
#  - Node 24 on the runner (ships npm 11.x; Node 22's bundled npm 10 lacks
#    the OIDC client)
#  - No `registry-url:` on actions/setup-node — that writes an .npmrc with
#    `_authToken=${NODE_AUTH_TOKEN}` which forces npm down the token-auth
#    path before it considers OIDC
#  - `--provenance` flag on each publish; npm verifies the provenance bundle
#    against this repo's public source via the sigstore transparency log
#  - This repo must be public (npm rejects provenance attestations from
#    private sources)
#  - A trusted-publisher entry per package on npmjs.com pointing at
#    `feedbakkr/feedbakkr-watch-sdk` + `publish-packages.yml`

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (e.g. latest, next)"
        required: true
        default: "latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from `packageManager` field in root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Pre-publish gate. Build runs before typecheck because workspace
      # packages cross-import each other via their built `dist/`. The audit
      # blocks on high+ advisories.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      - name: Audit (high+)
        run: pnpm audit --audit-level high

      # Pack every package with pnpm. `pnpm pack` rewrites the `workspace:^`
      # dependency specifiers to real version ranges; `npm publish` run in a
      # package directory does not, which shipped 0.2.3 of watch-web,
      # watch-node and watch-ui with uninstallable `workspace:^` deps.
      # The step fails if any `workspace:` specifier survives, and logs each
      # tarball's file list as a last-line defence against shipping a stray
      # credential or build artefact.
      - name: Pack packages
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          for pkg in watch-types watch-core watch-web watch-node watch-ui; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/packs")
          done
          for tgz in "$RUNNER_TEMP"/packs/*.tgz; do
            echo "--- $(basename "$tgz") ---"
            tar -tzf "$tgz"
            if tar -xzOf "$tgz" package/package.json | grep -q '"workspace:'; then
              echo "::error::$(basename "$tgz") still contains a workspace: dependency"
              exit 1
            fi
          done

      # Publish the packed tarballs with `npm publish` (not `pnpm publish`)
      # so the OIDC handshake fires through npm's native trusted-publisher
      # flow. `--access public` is required for first-time publishes of
      # scoped packages. `--provenance` triggers the OIDC exchange + sigstore
      # attestation. No `env: NODE_AUTH_TOKEN` — OIDC handles auth.
      # Dependencies first: types, core, then the packages that use them.
      - name: Publish packages
        run: |
          for pkg in watch-types watch-core watch-web watch-node watch-ui; do
            npm publish "$RUNNER_TEMP"/packs/feedbakkr-$pkg-*.tgz \
              --access public --provenance --tag ${{ github.event.inputs.tag }}
          done
