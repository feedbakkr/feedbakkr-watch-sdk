name: Scheduled Security Scan

on:
  schedule:
    # 04:00 UTC daily — staggered from the other Feedbakkr repos.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Scheduled security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Native dependency audit (moderate+)
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Install OSV-Scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/google/osv-scanner/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run OSV-Scanner (JSON report)
        run: osv-scanner --recursive --format=json --output=osv-report.json .
        continue-on-error: true

      - name: Run OSV-Scanner (human-readable summary)
        if: always()
        run: osv-scanner --recursive .
        continue-on-error: true

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osv-report
          path: osv-report.json
          retention-days: 30
          if-no-files-found: ignore
